<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="40%" stop-color="#0b0616"/>
      <stop offset="70%" stop-color="#12051e"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neon-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#ff0055" fill-opacity="0.18"/>
    </pattern>

    <pattern id="halftone-cyan" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.5" fill="#00f3ff" fill-opacity="0.12"/>
    </pattern>

    <!-- Radial Portal Glow -->
    <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#8b00ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00f3ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Dark Base Canvas -->
  <rect width="1200" height="800" fill="url(#sv-bg)"/>

  <!-- Halftone Ben-Day Dot Matrices -->
  <rect width="600" height="800" fill="url(#halftone)"/>
  <rect x="600" width="600" height="800" fill="url(#halftone-cyan)"/>

  <!-- Radial Portal Background Flare -->
  <circle cx="600" cy="400" r="380" fill="url(#portal-glow)"/>

  <!-- Perspective Distortion Grid / Bilinear Mesh Simulation -->
  <g stroke="#8b00ff" stroke-opacity="0.25" stroke-width="1" fill="none">
    <line x1="150" y1="120" x2="1050" y2="120"/>
    <line x1="180" y1="200" x2="1020" y2="200"/>
    <line x1="220" y1="300" x2="980" y2="300"/>
    <line x1="240" y1="400" x2="960" y2="400"/>
    <line x1="220" y1="500" x2="980" y2="500"/>
    <line x1="180" y1="600" x2="1020" y2="600"/>
    <line x1="150" y1="680" x2="1050" y2="680"/>

    <line x1="200" y1="100" x2="300" y2="700"/>
    <line x1="350" y1="90" x2="420" y2="710"/>
    <line x1="500" y1="80" x2="520" y2="720"/>
    <line x1="600" y1="80" x2="600" y2="720"/>
    <line x1="700" y1="80" x2="680" y2="720"/>
    <line x1="850" y1="90" x2="780" y2="710"/>
    <line x1="1000" y1="100" x2="900" y2="700"/>
  </g>

  <!-- Chromatic Aberration Polygons (Spider-Verse Glitch Style) -->
  <!-- Cyan Shift Layer -->
  <polygon points="460,180 750,160 840,420 720,630 380,590 320,360" 
           stroke="#00f3ff" stroke-width="2.5" fill="#00f3ff" fill-opacity="0.04" 
           transform="translate(-8, -4)" filter="url(#neon-cyan)"/>
  
  <!-- Red/Magenta Shift Layer -->
  <polygon points="460,180 750,160 840,420 720,630 380,590 320,360" 
           stroke="#ff0055" stroke-width="2.5" fill="#ff0055" fill-opacity="0.04" 
           transform="translate(8, 5)" filter="url(#neon-magenta)"/>

  <!-- Core White Shimmer Portal Ring -->
  <polygon points="460,180 750,160 840,420 720,630 380,590 320,360" 
           stroke="#ffffff" stroke-width="3" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Inner Dynamic Portal Fractures -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="460" y1="180" x2="600" y2="400"/>
    <line x1="750" y1="160" x2="600" y2="400"/>
    <line x1="840" y1="420" x2="600" y2="400"/>
    <line x1="720" y1="630" x2="600" y2="400"/>
    <line x1="380" y1="590" x2="600" y2="400"/>
    <line x1="320" y1="360" x2="600" y2="400"/>
  </g>

  <!-- MediaPipe Hand Tracking Skeleton / Landmarks Visual -->
  <g transform="translate(480, 260) scale(1.1)">
    <!-- Bones / Skeletal Vectors -->
    <path d="M110,230 L110,180 L80,120 L70,80 L65,50" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M110,180 L105,100 L100,55 L95,20" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M110,180 L130,105 L135,60 L140,25" stroke="#ff0055" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M110,180 L155,120 L165,80 L175,45" stroke="#ff0055" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M110,180 L170,165 L190,150 L210,135" stroke="#a855f7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Landmark Points -->
    <circle cx="110" cy="230" r="5" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
    <circle cx="110" cy="180" r="4" fill="#ffffff"/>
    <circle cx="80" cy="120" r="4" fill="#00f3ff"/>
    <circle cx="70" cy="80" r="4" fill="#00f3ff"/>
    <circle cx="65" cy="50" r="5" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
    <circle cx="105" cy="100" r="4" fill="#00f3ff"/>
    <circle cx="100" cy="55" r="4" fill="#00f3ff"/>
    <circle cx="95" cy="20" r="5" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
    <circle cx="130" cy="105" r="4" fill="#ff0055"/>
    <circle cx="135" cy="60" r="4" fill="#ff0055"/>
    <circle cx="140" cy="25" r="5" fill="#ffffff" stroke="#ff0055" stroke-width="2"/>
    <circle cx="155" cy="120" r="4" fill="#ff0055"/>
    <circle cx="165" cy="80" r="4" fill="#ff0055"/>
    <circle cx="175" cy="45" r="5" fill="#ffffff" stroke="#ff0055" stroke-width="2"/>
    <circle cx="170" cy="165" r="4" fill="#a855f7"/>
    <circle cx="190" cy="150" r="4" fill="#a855f7"/>
    <circle cx="210" cy="135" r="5" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Glitch Text Brand Overlay -->
  <g transform="translate(140, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00f3ff" letter-spacing="4" opacity="0.85">SPIDER-VERSE AR PORTAL // GLSL SHADERS</text>
  </g>
  <g transform="translate(780, 720)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ff0055" letter-spacing="2" opacity="0.85">MEDIAPIPE WASM • 60 FPS LOCKED</text>
  </g>

  <!-- Speed Lines & Glitch Fragments -->
  <line x1="80" y1="180" x2="220" y2="180" stroke="#00f3ff" stroke-width="2" opacity="0.5"/>
  <line x1="980" y1="620" x2="1120" y2="620" stroke="#ff0055" stroke-width="2" opacity="0.5"/>
  <line x1="1020" y1="240" x2="1140" y2="240" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
</svg>
